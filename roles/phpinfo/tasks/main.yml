---

- name: Install web infrastructure packages
  ansible.builtin.dnf:
    name: [httpd, php, firewalld]
    state: present

- name: Deploy dynamic php script
  ansible.builtin.template:
    src: hello.php.j2
    dest: /var/www/html/hello.php
    mode: '0644'

- name: Start web and firewall daemons
  ansible.builtin.service:
    name: "{{ item }}"
    state: started
    enabled: true
  loop: [httpd, firewalld]

- name: Open HTTP firewall ports
  ansible.posix.firewalld:
    service: http
    permanent: true
    state: enabled
    immediate: true
